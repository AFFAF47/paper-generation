<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Upload Subject Notes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { background-color: #f4f7f6; }
    .upload-card { border: none; border-radius: 15px; }
    .drop-zone {
      border: 2px dashed #0d6efd;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      background: #f8f9fa;
      transition: 0.3s;
      cursor: pointer;
    }
    .drop-zone:hover { background: #e9ecef; }
    .nav-link {
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .nav-link:hover {
      color: #ffca2c !important;
    }
  </style>
</head>
<body class="container py-5">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center" href="/exams">
      <i class="bi bi-cpu-fill me-2"></i> AI Exam Portal
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item px-2">
          <a class="nav-link active" href="/exams">
            <i class="bi bi-file-earmark-plus"></i> Generate
          </a>
        </li>
        <li class="nav-item px-2">
          <a class="nav-link" href="/exams/upload">
            <i class="bi bi-cloud-upload"></i> Upload
          </a>
        </li>
        <li class="nav-item px-2">
          <a class="nav-link" href="/exams/history-view">
            <i class="bi bi-clock-history"></i> History
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>📚 Knowledge Base Manager</h2>
  <a href="/exams" class="btn btn-outline-primary">Back to Generator</a>
</div>

<div class="card upload-card shadow-sm p-4">
  <form id="uploadForm">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label fw-bold">Subject</label>
        <input type="text" id="subject" name="subject" class="form-control" placeholder="e.g., Physics" required>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold">Class / Grade</label>
        <input type="text" id="className" name="className" class="form-control" placeholder="e.g., 10" required>
      </div>
      <div class="col-12">
        <label class="form-label fw-bold">Chapter / Unit Name</label>
        <input type="text" id="chapter" name="chapter" class="form-control" placeholder="e.g., Light Reflection" required>
      </div>

      <div class="col-12 mt-4">
        <div class="drop-zone" id="dropZone">
          <i class="bi bi-cloud-arrow-up fs-1 text-primary"></i>
          <p class="mt-2">Drag & Drop PDF Textbook or <span class="text-primary">Browse Files</span></p>
          <!-- Notice: No name attribute here so it is not submitted in standard form payloads -->
          <input type="file" id="fileInput" class="d-none" accept=".pdf" required>
          <div id="fileNameDisplay" class="text-success fw-bold mt-2"></div>
        </div>
      </div>

      <div class="col-12 mt-4">
        <button type="submit" id="uploadBtn" class="btn btn-primary w-100 btn-lg">
          Process & Sync to AI Brain
        </button>

        <div id="progressSection" class="d-none mt-3">
          <div class="progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
          </div>
          <p id="progressText" class="text-center text-muted mt-2">Preparing upload...</p>
        </div>

        <div id="statusAlert" class="alert d-none mt-3" role="alert"></div>
      </div>
    </div>
  </form>
</div>
<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileNameDisplay = document.getElementById('fileNameDisplay');
  const uploadForm = document.getElementById('uploadForm');
  const uploadBtn = document.getElementById('uploadBtn');
  const progressSection = document.getElementById('progressSection');
  const progressText = document.getElementById('progressText');
  const statusAlert = document.getElementById('statusAlert');

  // Drag and drop handlers
  dropZone.onclick = () => fileInput.click();

  dropZone.ondragover = (e) => {
    e.preventDefault();
    dropZone.classList.add('bg-light');
  };

  dropZone.ondragleave = () => {
    dropZone.classList.remove('bg-light');
  };

  dropZone.ondrop = (e) => {
    e.preventDefault();
    dropZone.classList.remove('bg-light');
    if (e.dataTransfer.files.length > 0) {
      fileInput.files = e.dataTransfer.files;
      fileNameDisplay.innerText = "Selected: " + e.dataTransfer.files[0].name;
    }
  };

  fileInput.onchange = (e) => {
    if (e.target.files.length > 0) {
      fileNameDisplay.innerText = "Selected: " + e.target.files[0].name;
    }
  };

  // Form submission: Presign -> Direct S3 PUT -> Trigger Vectorization
  uploadForm.onsubmit = async (e) => {
    e.preventDefault();

    const file = fileInput.files[0];
    if (!file) {
      alert("Please select a PDF file first.");
      return;
    }

    uploadBtn.classList.add('d-none');
    progressSection.classList.remove('d-none');
    statusAlert.classList.add('d-none');

    try {
      // 1. Get Presigned Upload URL from backend
      progressText.innerText = "Requesting secure S3 upload link...";
      const presignResponse = await fetch(`/api/notes/presigned-url?fileName=${encodeURIComponent(file.name)}`);

      if (!presignResponse.ok) {
        throw new Error("Could not retrieve upload URL from server.");
      }

      const { uploadUrl, objectKey } = await presignResponse.json();

      // 2. Upload directly to S3 (bypasses Lambda 6 MB payload limit)
      progressText.innerText = `Uploading ${file.name} directly to storage...`;
      const s3Response = await fetch(uploadUrl, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/pdf'
        },
        body: file
      });

      if (!s3Response.ok) {
        throw new Error("Direct upload to S3 failed. Please check CORS configuration.");
      }

      // 3. Notify backend to download from S3, embed to Pinecone, and purge
      progressText.innerText = "Indexing chunks with Bedrock Titan & syncing vectors...";
      const formData = new FormData();
      formData.append('objectKey', objectKey);
      formData.append('subject', document.getElementById('subject').value);
      formData.append('className', document.getElementById('className').value);
      formData.append('chapter', document.getElementById('chapter').value);

      const processResponse = await fetch('/api/notes/upload', {
        method: 'POST',
        body: formData
      });

      if (!processResponse.ok) {
        const errorMsg = await processResponse.text();
        throw new Error(errorMsg || "Vectorization failed on server.");
      }

      // Success UI state
      progressSection.classList.add('d-none');
      statusAlert.className = "alert alert-success mt-3";
      statusAlert.innerText = "✅ Notes successfully processed and synced to vector database!";
      statusAlert.classList.remove('d-none');
      uploadForm.reset();
      fileNameDisplay.innerText = "";
      uploadBtn.classList.remove('d-none');

    } catch (err) {
      console.error(err);
      progressSection.classList.add('d-none');
      uploadBtn.classList.remove('d-none');
      statusAlert.className = "alert alert-danger mt-3";
      statusAlert.innerText = "❌ " + err.message;
      statusAlert.classList.remove('d-none');
    }
  };
</script>
</body>
</html>
