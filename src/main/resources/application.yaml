spring:
  application:
    name: papergenerator

  cloud:
    aws:
      region:
        static: ap-south-1

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: school_ai_db

  ai:
    vectorstore:
      pinecone:
        apiKey: ${PINECONE_API_KEY}
        index-name: "school-notes"
        project-id: "r3jj6iu"
        environment: "aped-4627-b74a"
        namespace: "default"

  servlet:
    multipart:
      enabled: true
      location: /tmp
      max-file-size: 10MB
      max-request-size: 10MB

app:
  sqs:
    queue-name: exam-generation-queue